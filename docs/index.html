<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agent — Text to Speech</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Text to Speech</h1>

    <div class="row">
      <div class="col">
        <label for="model">Model</label>
        <select id="model">
          <option value="tts-1">tts-1</option>
          <option value="tts-1-hd">tts-1-hd</option>
          <option value="gpt-4o-mini-tts" selected>gpt-4o-mini-tts</option>
        </select>
      </div>

      <div class="col">
        <label for="voice">Voice</label>
        <select id="voice">
          <option value="marin">marin (recommended)</option>
          <option value="cedar">cedar (recommended)</option>
          <option value="alloy">alloy</option>
          <option value="ash">ash</option>
          <option value="ballad">ballad</option>
          <option value="coral">coral</option>
          <option value="echo">echo</option>
          <option value="fable">fable</option>
          <option value="nova" selected>nova</option>
          <option value="onyx">onyx</option>
          <option value="sage">sage</option>
          <option value="shimmer">shimmer</option>
          <option value="verse">verse</option>
        </select>
      </div>
    </div>
    <p class="hint">Note: ballad, marin, cedar, and verse only work with gpt-4o-mini-tts, not with tts-1 / tts-1-hd.</p>

    <label for="text">Text to speak</label>
    <textarea id="text" rows="6" placeholder="Paste the text you want to voice..."></textarea>

    <label for="prompt">Prompt (tone instructions)</label>
    <textarea id="prompt" rows="3">Read the text with a tone that is clear, professional, high energy and confident, but not monotonous. Add slight warmth and emphasis so learners stay interested.</textarea>

    <div class="actions">
      <button id="playBtn">▶ Play</button>
      <button id="saveBtn" disabled>⬇ Save mp3</button>
    </div>

    <p id="status" class="status"></p>

    <audio id="player" controls></audio>
  </main>

  <script src="app.js"></script>
</body>
</html>
