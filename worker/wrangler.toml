name = "voice-agent"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ALLOWED_ORIGIN = "https://hrystynaivaniv.github.io"

# Secrets (OPENAI_API_KEY, ACCESS_CODE) are NOT stored here.
# Set them with:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ACCESS_CODE

# Optional, for rate limiting. Create the namespace:
#   wrangler kv namespace create RATE_LIMIT_KV
# and paste the id it prints:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
